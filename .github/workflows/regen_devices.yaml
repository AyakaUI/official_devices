name: Update AyakaUI devices and list

on:
  push:
    paths:
      - .github/workflows/regen_devices.yaml
      - .github/scripts/regen_devices.py
      - API/**
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regen devices json and device list
        run: python3 .github/scripts/regen_devices.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: "[CI] Update AyakaUI devices list"
          file_pattern: "API/devices.json docs/DeviceList.md"

      - name: Wait for cache
        run: sleep 10

      - name: Revalidate website
        if: success()
        env:
          TOKEN: ${{ secrets.REVALIDATION_SECRET }}
          BYPASS_TOKEN: ${{ secrets.CF_BYPASS_TOKEN }}

        run: |
          curl -X POST https://ayakaui.vercel.app/api/revalidate \
            -H "Authorization: Bearer $TOKEN" \
            -H "cf-bypass: $BYPASS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            -d '{"target":"all"}'
